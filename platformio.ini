; PoolGuard – ESP32 pool pump / dosing pump controller with web dashboard
;
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = PoolGuard

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/check_lib_updates.py

; OTA upload over WiFi instead of USB. Requires the board to already be running
; firmware with Config::OTA_ENABLED = true (flashed once via USB).
; The OTA password is read from the OTA_PASSWORD environment variable at upload
; time, NOT hardcoded here, so it never ends up committed to git — set it to the
; same value as Config::OTA_PASSWORD before uploading, e.g.:
;   export OTA_PASSWORD=DEIN_OTA_PASSWORT
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = Poolguard.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
